[project]
name = "eeg-harmonize"
version = "0.1.0"
description = "Canonical schema and conversion layer for public EEG corpora."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "eeg-harmonize contributors" }]
dependencies = [
  "pydantic>=2.10",
  "structlog>=24.4",
  "typer>=0.15",
  "rich>=13.9",
  "duckdb>=1.1",
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
eegh = "eeg_harmonize.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eeg_harmonize"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["eeg_harmonize"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=eeg_harmonize --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/eeg_harmonize"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
